<meta name="apple-mobile-web-app-title" content="服薬管理"><meta name="theme-color" content="#f8f4f8"><title>服薬管理</title><style>
:root{--bg:#fff5f7;--card:#fff;--tx:#38343a;--muted:#9a7f86;--blue:#dcecff;--green:#dcf3df;--red:#ffdce5;--purple:#f6dff0;--yellow:#fff0f3;--line:#f3dce2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}.head{padding:20px 18px 8px}.head h1{font-size:25px;margin:0}.head p{margin:4px 0;color:var(--muted);font-size:12px}main{padding:8px 15px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:13px;box-shadow:0 4px 15px #5b46600a}.status{text-align:center;padding:24px}.small{font-size:13px;color:var(--muted)}.big{font-size:31px;font-weight:800;margin:7px}.bar{height:8px;background:#eee9ef;border-radius:8px;overflow:hidden;margin:16px 0 6px}.bar i{display:block;height:100%;background:#ffc0cb}.row{display:flex;gap:9px}.btn{border:0;border-radius:16px;padding:16px 9px;font-weight:750;font-size:15px;flex:1}.b{background:var(--blue);color:#45627a}.r{background:var(--red);color:#a34f69}.g{background:var(--green);color:#4f7658}.p{background:var(--purple);color:#705878}.gray{background:#efecf0;color:#625d65}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{background:#fff8fa;border-radius:15px;padding:13px}.mini span{font-size:11px;color:var(--muted)}.mini b{display:block;margin-top:5px}.plan{background:var(--yellow);color:#76623c}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fffffff5;border-top:1px solid var(--line);display:flex;z-index:9}.tab{flex:1;border:0;background:none;color:#99909b;font-size:11px}.tab.on{color:#d77f91;font-weight:800}.tab strong{display:block;font-size:21px;margin-bottom:2px}.hide{display:none}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.nav{border:0;background:#ffe8ee;border-radius:12px;padding:8px 13px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:10px;padding:4px}.day{min-height:63px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-size:11px;text-align:left}.today{outline:2px solid #ffc0cb}.planned{background:#fffaf0;border:1px dashed #d8c38c}.mark{font-size:14px;margin-top:4px;line-height:1.15}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.list{display:grid;gap:9px}.cycle{border:1px solid var(--line);border-radius:16px;padding:14px}.cycle b{display:block;margin-bottom:6px}.cycle p{font-size:12px;margin:4px;color:#655f67}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #efcfd8;border-radius:12px;font-size:16px}.note{font-size:11px;line-height:1.6;color:var(--muted)}.rulebox{background:#fff3f6;border-radius:16px;padding:12px 14px;margin-top:14px}.rulebox p{font-size:12px;line-height:1.7;margin:0 0 10px}.rulebox p:last-child{margin-bottom:0}.modal{position:fixed;inset:0;background:#2d253355;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(520px,100%);border-radius:25px 25px 0 0;padding:20px}.sheet h2{margin-top:0}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#39343b;color:white;padding:10px 15px;border-radius:99px;font-size:12px;z-index:30}
.diag{display:none;position:fixed;left:8px;right:8px;bottom:84px;background:#fff3cd;color:#7a5b12;border:1px solid #f0dca0;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;z-index:20;word-break:break-all}</style></head><body><div class="app"><header class="head"><h1>服薬管理</h1></header><main id="home"></main><main id="calendar" class="hide"></main><main id="history" class="hide"></main><main id="settings" class="hide"></main><nav class="tabs"><button class="tab on" data-p="home"><strong>⌂</strong>ホーム</button><button class="tab" data-p="calendar"><strong>▦</strong>カレンダー</button><button class="tab" data-p="history"><strong>☷</strong>一覧</button><button class="tab" data-p="settings"><strong>⚙</strong>設定</button></nav></div><div id="modal"></div><div id="diag" class="diag"></div>
<script>
window.addEventListener('error',function(ev){try{var d=document.getElementById('diag');if(d){d.style.display='block';d.textContent='⚠ '+(ev.message||ev.type)+'（'+(ev.lineno||'')+'行目）'}}catch(_){}});
const K='pillManagerV4';
const DEFAULT={max:120,rest:4,api:'',tok:'',e:{}};
const MED_RANGES=[
 ['2023-02-16','2023-06-13'],['2023-06-18','2023-09-12'],['2023-09-17','2023-12-25'],
 ['2023-12-30','2024-04-10'],['2024-04-15','2024-08-05'],['2024-08-10','2024-09-24'],
 ['2024-09-29','2025-01-22'],['2025-01-27','2025-05-26'],['2025-05-31','2025-08-17'],
 ['2025-08-22','2025-10-11'],['2025-12-31','2026-02-13'],['2026-02-18','2026-06-01'],
 ['2026-06-06','2026-09-22'],['2026-09-26','2026-09-27']
];
const pad2=n=>(n<10?'0':'')+n,isoOf=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())};
function buildHistory(){
  const e={};
  const start=new Date('2023-02-16T00:00:00'), end=new Date('2026-09-27T00:00:00');
  const med=new Set();
  const iso=isoOf;
  for(const [a,b] of MED_RANGES){let d=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00');while(d<=z){med.add(iso(d));d.setDate(d.getDate()+1)}}
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const x=iso(d);e[x]=med.has(x)?{med:true}:{rest:true}}
  e['2026-09-27'].time=new Date().toISOString();
  return e;
}
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return{ok:true,get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v)}}catch(e){const m={};return{ok:false,get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();
let s=null;try{s=JSON.parse(store.get(K)||'null')}catch(e){s=null}
if(!s||typeof s!=='object')s={...DEFAULT,e:buildHistory()};
if(!s.e||Object.keys(s.e).length===0)s.e=buildHistory();
s.max=+s.max||120;s.rest=+s.rest||4;s.api=(s.api||'').trim();s.tok=(s.tok||'').trim();if('notify' in s)delete s.notify;
let cm=new Date();cm.setDate(1);
const I=isoOf,T=()=>{let d=new Date();d.setHours(0,0,0,0);return d},P=x=>new Date(x+'T00:00:00'),A=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},F=(()=>{const f=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});return x=>f.format(P(x))})(),E=x=>s.e[x]||{},save=()=>store.set(K,JSON.stringify(s));
function set(x,v){let next={...E(x),...v};if(!Object.values(next).some(Boolean))delete s.e[x];else s.e[x]=next;save()}
function medRun(x){let n=0,d=P(x);while(E(I(d)).med){n++;d=A(d,-1)}return n}
function bleedRun(x){let n=0,d=P(x);while(E(I(d)).bleed){n++;d=A(d,-1)}return n}
function restRun(x){let n=0,d=P(x);while(E(I(d)).rest){n++;d=A(d,-1)}return n}
function latestMedDate(){let ds=Object.keys(s.e).filter(x=>E(x).med).sort();return ds.length?ds[ds.length-1]:null}
function currentMedStart(){let last=latestMedDate();if(!last)return null;let d=P(last);while(E(I(A(d,-1))).med)d=A(d,-1);return I(d)}
function plannedRestStart(){
  const today=I(T());
  // 3日連続出血が今日で成立 → 明日から休薬
  if(bleedRun(today)>=3)return I(A(T(),1));
  // 直近の服薬日を基準に120日目の翌日を予定休薬開始日とする
  const start=currentMedStart();
  if(!start)return null;
  const day=medRun(latestMedDate());
  const last=latestMedDate();
  if(day>=+s.max)return I(A(P(last),1));
  return I(A(P(start),+s.max));
}
function projectedRestDates(){
  const start=plannedRestStart();if(!start)return new Set();
  const out=new Set();for(let i=0;i<+s.rest;i++)out.add(I(A(P(start),i)));return out;
}
function autoRest(){
  // 3日連続の出血、または上限日数の連続服薬が成立したら、翌日から休薬を自動記録。
  const dates=Object.keys(s.e).sort();
  let changed=false;
  const applyRest=st=>{
    for(let i=0;i<+s.rest;i++){
      const y=I(A(P(st),i)),old=E(y);
      if(old.med||!old.rest){s.e[y]={...old,med:false,rest:true};changed=true}
    }
  };
  // ① 3日連続の出血：最初の3日目の翌日から
  let bStart=null,bPrev=null,bLen=0;
  for(const x of dates){
    if(!E(x).bleed){bStart=null;bLen=0;continue}
    if(bStart===null||I(A(P(bPrev),1))!==x){bStart=x;bLen=1}else bLen++;
    bPrev=x;
    if(bLen===3){applyRest(I(A(P(x),1)));break}
  }
  // ② 連続服薬の上限：上限に達した日の翌日から（全期間を1パスで走査）
  let mStart=null,mPrev=null,mLen=0;
  for(const x of dates){
    if(!E(x).med){mStart=null;mLen=0;continue}
    if(mStart===null||I(A(P(mPrev),1))!==x){mStart=x;mLen=1}else mLen++;
    mPrev=x;
    if(mLen>=+s.max){applyRest(I(A(P(mStart),+s.max)));break}
  }
  if(changed)save();
}
function status(){
  const x=I(T()),e=E(x);
  if(e.rest){return ['rest',restRun(x)]}
  if(e.med){return ['med',medRun(x)]}
  return ['none',0]
}
function toast(t){let q=document.createElement('div');q.className='toast';q.textContent=t;document.body.append(q);setTimeout(()=>q.remove(),1600)}
function take(){
  const x=I(T()),old=E(x);
  // 服薬を押した瞬間に「服薬1日目」へ反映。出血記録は消さない。
  set(x,{...old,med:true,rest:false,time:new Date().toISOString()});
  render();toast('今日の服薬を記録しました');pushSync([x]);
}
function manualRest(){
  const st=T(),ds=[];
  for(let i=0;i<+s.rest;i++){
    const x=I(A(st,i)),old=E(x);
    s.e[x]={...old,med:false,rest:true};
    ds.push(x);
  }
  save();render();toast('今日から休薬を開始しました');pushSync(ds);
}
function bleed(){
  const x=I(T()),old=E(x),next=!old.bleed;
  set(x,{...old,bleed:next});
  autoRest();render();toast(next?'出血を記録しました':'出血記録を解除しました');pushSync([x]);
}
function home(){
  let [t,n]=status(),x=I(T()),e=E(x),pct=t==='med'?Math.min(100,n/+s.max*100):t==='rest'?n/+s.rest*100:0;
  const b=[0,1,2].filter(i=>E(I(A(T(),-i))).bleed).length;
  const ps=plannedRestStart();
  let next='—';
  if(t==='rest')next=`休薬中（あと${Math.max(0,+s.rest-n)}日）`;
  else if(ps)next=`${F(ps)}から${s.rest}日`;
  else if(t==='med')next=`あと${Math.max(0,+s.max-n)}日`;
  document.querySelector('#home').innerHTML=`
  <div class="card status"><div class="small">${t==='rest'?'現在は休薬期間':t==='med'?'現在は服薬期間':'記録待ち'}</div><div class="big">${t==='rest'?`休薬 ${n}日目`:t==='med'?`連続服薬 ${n}日目`:'服薬開始前'}</div><div class="small">${F(x)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="note">${t==='rest'?`あと${Math.max(0,+s.rest-n)}日で服薬再開`:`上限 ${s.max}日まであと${Math.max(0,+s.max-n)}日`}</div></div>
  <div class="card"><div class="row"><button class="btn b" onclick="take()">💊 服薬${e.med?' ✓':''}</button><button class="btn g" onclick="manualRest()">🌱 休薬</button><button class="btn r" onclick="bleed()">🌷${e.bleed?' ✓':''}</button></div><div class="note" style="margin-top:9px">${e.time?'服薬時刻：'+new Date(e.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'「服薬」を押すと、今日の服薬としてすぐに記録されます。'}</div></div>
  <div class="card"><div class="summary"><div class="mini"><span>次の休薬予定</span><b>${next}</b></div><div class="mini"><span>過去3日間の出血</span><b>${b}日</b></div></div>${ps?`<p class="note" style="margin-top:10px">📅 カレンダーでは、次の休薬${F(ps)}〜${F(I(A(P(ps),+s.rest-1)))}を予定として表示しています。</p>`:''}</div>
`
}
function cal(){
  let y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),w=f.getDay(),planned=projectedRestDates(),h='';
  for(let q of ['日','月','火','水','木','金','土'])h+=`<div class="dow">${q}</div>`;
  for(let i=0;i<w;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    let x=I(new Date(y,m,d)),e=E(x),isPlan=planned.has(x)&&!e.rest;
    let marks=(e.med?'💊':'')+(e.rest?'🌱':'')+(e.bleed?'🌷':'')+(isPlan?'🌱':'');
    h+=`<button class="day ${x===I(T())?'today':''} ${isPlan?'planned':''}" onclick="edit('${x}')"><b>${d}</b><div class="mark">${marks||' '}</div>${isPlan?'<div style="font-size:9px;color:#8b7545">休薬予定</div>':''}</button>`
  }
  document.querySelector('#calendar').innerHTML=`<div class="card"><div class="month"><button class="nav" onclick="cm.setMonth(cm.getMonth()-1);render()">‹</button><b>${y}年${m+1}月</b><button class="nav" onclick="cm.setMonth(cm.getMonth()+1);render()">›</button></div><div class="cal">${h}</div><div class="legend"><span>💊服薬</span><span>🌱休薬</span><span>🌷出血</span></div><p class="note">3日連続出血、または${s.max}日連続服薬が成立すると、翌日から${s.rest}日間が自動的に休薬表示になります。休薬は🌱、出血は🌷で表示します。日付をタップすると修正できます。</p></div>`
}
function edit(x){let e=E(x);document.querySelector('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><h2>${F(x)}</h2><button class="btn b" onclick="tog('${x}','med')">服薬 ${e.med?'✓':''}</button><br><br><button class="btn r" onclick="tog('${x}','bleed')">出血 ${e.bleed?'✓':''}</button><br><br><button class="btn g" onclick="tog('${x}','rest')">休薬 ${e.rest?'✓':''}</button><br><br><button class="btn gray" onclick="del('${x}')">この日の記録を削除</button><p class="note">過去の日付も追加・修正・削除できます。</p></div></div>`}
function closeM(){document.querySelector('#modal').innerHTML=''}
function tog(x,k){let e=E(x);e[k]=!e[k];if(k==='med'&&e.med){e.rest=false;e.time=new Date().toISOString()}if(k==='rest'&&e.rest)e.med=false;set(x,e);autoRest();closeM();render();pushSync([x])}
function del(x){delete s.e[x];save();closeM();render();pushSync([x])}
function history(){let meds=Object.keys(s.e).filter(x=>E(x).med).sort(),groups=[],cur=null;for(const x of meds){if(!cur||I(A(P(cur.b),1))!==x){if(cur)groups.push(cur);cur={a:x,b:x}}else cur.b=x}if(cur)groups.push(cur);document.querySelector('#history').innerHTML=`<div class="card"><h3>サイクル履歴</h3><div class="list">${groups.length?groups.map((c,i)=>{let rs=Object.keys(s.e).filter(x=>E(x).rest&&x>=I(A(P(c.b),1))).sort();let r1=rs[0],r2=r1?rs[Math.min(+s.rest-1,rs.length-1)]:null;return `<div class="cycle"><b>第${i+1}サイクル</b><p>服薬：${F(c.a)}〜${F(c.b)}（${Math.floor((P(c.b)-P(c.a))/86400000)+1}日）</p><p>休薬：${r1?F(r1)+'〜'+F(r2):'—'}</p></div>`}).join(''):'<p class="note">服薬記録がまだありません。</p>'}</div></div>`}
function settings(){document.querySelector('#settings').innerHTML=`<div class="card"><h3>設定</h3><h4 style="margin:20px 0 4px">判定ルール</h4><label>連続服薬の上限日数</label><input id="mx" type="number" min="1" max="365" value="${s.max}"><label>休薬日数</label><input id="rs" type="number" min="1" max="14" value="${s.rest}"><div class="rulebox"><p><b>① 連続服薬の上限</b><br>${s.max}日連続で服薬した場合、翌日から${s.rest}日間を休薬とします。</p><p><b>② 3日連続の出血</b><br>出血が3日連続した場合は、${s.max}日の上限よりもこちらを優先し、3日目の翌日から${s.rest}日間を休薬とします。</p><p><b>③ 手動休薬</b><br>ホームの「休薬」を押すと、今日から${s.rest}日間を休薬として記録します。</p></div><button class="btn p" style="margin-top:16px;width:100%" onclick="saveSet()">設定を保存</button><p class="note">初期値：連続服薬120日／休薬4日。データは端末のLocalStorageに保存されます。保存状態：${store.ok?'OK':'保存不可（プライベートブラウズ等）'}／記録日数：${Object.keys(s.e).length}日。</p></div><div class="card"><h3>LINE連携</h3><label>Google Apps Script の Web アプリ URL（/exec）</label><input id="api" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${s.api}"><label>合言葉（Code.gs の SYNC_TOKEN と同じ文字列）</label><input id="tok" type="text" placeholder="Code.gs 側で決めた文字列" value="${s.tok}"><div class="row" style="margin-top:12px"><button class="btn p" onclick="saveSet()">保存</button><button class="btn b" onclick="pullSync(true)">接続テスト</button></div><button class="btn gray" style="width:100%;margin-top:9px" onclick="pushAllSync()">この端末の記録をサーバーへ送る</button><p class="note" id="syncst">状態：${sync.st}${sync.detail?'（'+esc(sync.detail)+'）':''}${sync.at?'／'+sync.at.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):''}</p><p class="note">LINEで「はい」を押した記録は、この画面を開いたときに自動で取り込みます。「接続テスト」で読み込み直せます。</p></div><div class="card"><button class="btn gray" style="width:100%" onclick="if(confirm('全記録を削除しますか？')){s={max:120,rest:4,api:s.api,tok:s.tok,e:{}};save();render()}else{}">全記録を削除</button></div>`}
function saveSet(){
  s.api=(document.querySelector('#api').value||'').trim();
  s.tok=(document.querySelector('#tok').value||'').trim();
  s.max=+document.querySelector('#mx').value||120;
  s.rest=+document.querySelector('#rs').value||4;
  save();render();toast('設定を保存しました');
  if(synced())pullSync(true);
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- サーバー同期（Google Apps Script） ---------- */
let sync={st:'未設定',detail:'',at:null},lastPull=0;
function synced(){return !!(s.api&&/^https:\/\/script\.google\.com\//.test(s.api))}
function setSync(st,detail){
  sync={st:st,detail:detail||'',at:new Date()};
  const el=document.querySelector('#syncst');
  if(el)el.textContent='状態：'+st+(sync.detail?'（'+sync.detail+'）':'')+'／'+sync.at.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  else settings();
}
function apiGet(p){
  const q=new URLSearchParams(p);q.set('token',s.tok||'');
  return fetch(s.api+'?'+q.toString(),{method:'GET',redirect:'follow'})
   .then(r=>r.text())
   .then(t=>{let j;try{j=JSON.parse(t)}catch(e){throw new Error('応答がJSONではありません：'+t.slice(0,90))}
     if(!j.ok)throw new Error(j.error||'サーバーエラー');return j});
}
function pullSync(force){
  if(!synced()){setSync('未設定',s.api?'URLの形式が違います':'URLが未入力');return}
  if(!force&&Date.now()-lastPull<60000)return;
  lastPull=Date.now();setSync('同期中…');
  apiGet({action:'pull'}).then(j=>{
    if(j.config){if(+j.config.max>0)s.max=+j.config.max;if(+j.config.rest>0)s.rest=+j.config.rest}
    let n=0;
    (j.records||[]).forEach(r=>{
      if(!r||!r.date)return;
      const o={};if(r.med)o.med=true;if(r.bleed)o.bleed=true;if(r.rest)o.rest=true;if(r.time)o.time=r.time;
      if(Object.keys(o).length)s.e[r.date]=o;else delete s.e[r.date];
      n++;
    });
    save();render();setSync('接続OK（サーバーから'+n+'件）');
  }).catch(e=>setSync('エラー',e.message));
}
function pushSync(ds){
  if(!synced()||!ds||!ds.length)return;
  const payload=ds.map(d=>Object.assign({date:d},s.e[d]||{}));
  setSync('送信中…');
  apiGet({action:'push',payload:JSON.stringify(payload),config:JSON.stringify({max:s.max,rest:s.rest})})
   .then(j=>setSync('送信OK（'+j.applied+'件）'))
   .catch(e=>setSync('送信エラー',e.message));
}
function localDiff(){
  const base=buildHistory();
  return Object.keys(s.e).filter(d=>{const a=s.e[d]||{},b=base[d]||{};
    return (!!a.med!==!!b.med)||(!!a.rest!==!!b.rest)||!!a.bleed}).sort();
}
function pushAllSync(){
  if(!synced()){setSync('未設定',s.api?'URLの形式が違います':'URLが未入力');return}
  const diff=localDiff();
  if(!diff.length){setSync('送る記録がありません');return}
  const chunks=[];for(let i=0;i<diff.length;i+=50)chunks.push(diff.slice(i,i+50));
  let done=0;
  const step=()=>{
    if(!chunks.length){setSync('送信完了（'+diff.length+'日分）');return}
    const c=chunks.shift();
    const payload=c.map(d=>Object.assign({date:d},s.e[d]||{}));
    apiGet({action:'push',payload:JSON.stringify(payload),config:JSON.stringify({max:s.max,rest:s.rest})})
     .then(()=>{done+=c.length;setSync('送信中…（'+done+'/'+diff.length+'）');step()})
     .catch(e=>setSync('送信エラー',e.message));
  };step();
}
function render(){autoRest();home();cal();history();settings()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['home','calendar','history','settings'].forEach(p=>document.querySelector('#'+p).classList.toggle('hide',p!==b.dataset.p))});
render();
if(synced())pullSync(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&synced())pullSync(false)});
