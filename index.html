<meta name="apple-mobile-web-app-title" content="服薬管理"><meta name="theme-color" content="#f8f4f8"><title>服薬管理</title><style>

.nav:active{background:#ffd0e0;transform:scale(.92);box-shadow:none}.today-btn{width:100%;min-height:44px;margin:-2px 0 12px;border:0;border-radius:14px;background:#ffe8ee;color:#b5627a;font-weight:800;font-size:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.today-btn:active{background:#ffd0e0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--muted);font-size:10px;padding:4px}.day{min-height:63px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;font-size:11px;text-align:left}.today{outline:2px solid #ffc0cb}.exam-period{background:#eef4ff;border-color:#cfe0f5}.exam-day{border:2px solid #6f9bd1;background:#dfeaff}.planned{background:#fffaf0;border:1px dashed #d8c38c}.mark{font-size:14px;margin-top:4px;line-height:1.15}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.list{display:grid;gap:9px}.cycle{border:1px solid var(--line);border-radius:16px;padding:14px}.cycle b{display:block;margin-bottom:6px}.cycle p{font-size:12px;margin:4px;color:#655f67}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #efcfd8;border-radius:12px;font-size:16px}.note{font-size:11px;line-height:1.6;color:var(--muted)}.rulebox{background:#fff3f6;border-radius:16px;padding:12px 14px;margin-top:14px}.rulebox p{font-size:12px;line-height:1.7;margin:0 0 10px}.rulebox p:last-child{margin-bottom:0}.modal{position:fixed;inset:0;background:#2d253355;display:flex;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(520px,100%);border-radius:25px 25px 0 0;padding:20px}.sheet h2{margin-top:0}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#39343b;color:white;padding:10px 15px;border-radius:99px;font-size:12px;z-index:30}

<script>
window.addEventListener('error',function(ev){try{var d=document.getElementById('diag');if(d){d.style.display='block';d.textContent='⚠ '+(ev.message||ev.type)+'（'+(ev.lineno||'')+'行目）'}}catch(_){}});
const K='pillManagerV4';
const DEFAULT={max:120,rest:4,sheetDays:24,sheets:3,sheetBase:3,sheetStart:'2026-10-08',exam:'',e:{}};
const MED_RANGES=[
 ['2023-02-16','2023-06-13'],['2023-06-18','2023-09-12'],['2023-09-17','2023-12-25'],
 ['2023-12-30','2024-04-10'],['2024-04-15','2024-08-05'],['2024-08-10','2024-09-24'],
 ['2024-09-29','2025-01-22'],['2025-01-27','2025-05-26'],['2025-05-31','2025-08-17'],
 ['2025-08-22','2025-10-11'],['2025-12-31','2026-02-13'],['2026-02-18','2026-06-01'],
 ['2026-06-06','2026-09-22'],['2026-09-26','2026-09-27']
];
const pad2=n=>(n<10?'0':'')+n,isoOf=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())};
function buildHistory(){
  const e={};
  const start=new Date('2023-02-16T00:00:00'), end=new Date('2026-09-27T00:00:00');
  const med=new Set();
  const iso=isoOf;
  for(const [a,b] of MED_RANGES){let d=new Date(a+'T00:00:00'),z=new Date(b+'T00:00:00');while(d<=z){med.add(iso(d));d.setDate(d.getDate()+1)}}
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const x=iso(d);e[x]=med.has(x)?{med:true}:{rest:true}}
  e['2026-09-27'].time=new Date().toISOString();
  return e;
}
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return{ok:true,get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v)}}catch(e){const m={};return{ok:false,get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();
let s=null;try{s=JSON.parse(store.get(K)||'null')}catch(e){s=null}
if(!s||typeof s!=='object')s={...DEFAULT,e:buildHistory()};
if(!s.e||Object.keys(s.e).length===0)s.e=buildHistory();
s.max=+s.max||120;s.rest=+s.rest||4;s.sheetDays=+s.sheetDays||24;s.sheets=+s.sheets||3;s.sheetBase=+s.sheetBase||3;
if(!s.sheetStart)s.sheetStart='2026-10-08';
if(typeof s.exam!=='string')s.exam=isoOf(s.exam||'');
if('notify' in s)delete s.notify;if('api' in s)delete s.api;if('tok' in s)delete s.tok;
let cm=new Date();cm.setDate(1);
const I=isoOf,T=()=>{let d=new Date();d.setHours(0,0,0,0);return d},P=x=>new Date(x+'T00:00:00'),A=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},F=(()=>{const f=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});return x=>f.format(P(x))})(),E=x=>s.e[x]||{},save=()=>store.set(K,JSON.stringify(s));
function set(x,v){let next={...E(x),...v};if(!Object.values(next).some(Boolean))delete s.e[x];else s.e[x]=next;save()}
function medRun(x){let n=0,d=P(x);while(E(I(d)).med){n++;d=A(d,-1)}return n}
function bleedRun(x){let n=0,d=P(x);while(E(I(d)).bleed){n++;d=A(d,-1)}return n}
function restRun(x){let n=0,d=P(x);while(E(I(d)).rest){n++;d=A(d,-1)}return n}
function latestMedDate(){let ds=Object.keys(s.e).filter(x=>E(x).med).sort();return ds.length?ds[ds.length-1]:null}
function currentMedStart(){let last=latestMedDate();if(!last)return null;let d=P(last);while(E(I(A(d,-1))).med)d=A(d,-1);return I(d)}
function plannedRestStart(){
  const today=I(T());
  // 3日連続出血が今日で成立 → 明日から休薬
  if(bleedRun(today)>=3)return I(A(T(),1));
  // 直近の服薬日を基準に120日目の翌日を予定休薬開始日とする
  const start=currentMedStart();
  if(!start)return null;
  const day=medRun(latestMedDate());
  const last=latestMedDate();
  if(day>=+s.max)return I(A(P(last),1));
  return I(A(P(start),+s.max));
}
function projectedRestDates(){
  const start=plannedRestStart();if(!start)return new Set();
  const out=new Set();for(let i=0;i<+s.rest;i++)out.add(I(A(P(start),i)));return out;
}
function autoRest(){
  // 3日連続の出血、または上限日数の連続服薬が成立したら、翌日から休薬を自動記録。
  const dates=Object.keys(s.e).sort();
  let changed=false;
  const applyRest=st=>{
    for(let i=0;i<+s.rest;i++){
      const y=I(A(P(st),i)),old=E(y);
      if(old.med||!old.rest){s.e[y]={...old,med:false,rest:true};changed=true}
    }
  };
  // ① 3日連続の出血：最初の3日目の翌日から
  let bStart=null,bPrev=null,bLen=0;
  for(const x of dates){
    if(!E(x).bleed){bStart=null;bLen=0;continue}
    if(bStart===null||I(A(P(bPrev),1))!==x){bStart=x;bLen=1}else bLen++;
    bPrev=x;
    if(bLen===3){applyRest(I(A(P(x),1)));break}
  }
  // ② 連続服薬の上限：上限に達した日の翌日から（全期間を1パスで走査）
  let mStart=null,mPrev=null,mLen=0;
  for(const x of dates){
    if(!E(x).med){mStart=null;mLen=0;continue}
    if(mStart===null||I(A(P(mPrev),1))!==x){mStart=x;mLen=1}else mLen++;
    mPrev=x;
    if(mLen>=+s.max){applyRest(I(A(P(mStart),+s.max)));break}
  }
  if(changed)save();
}

/* ===== シート（24日／3シート）と診察のめやす ===== */
function sheetInfo(){
  const conf={days:+s.sheetDays||24,n:+s.sheets||3,start:s.sheetStart||'2026-10-08'};
  const start=P(conf.start);
  // 起点から「24錠 + その後の休薬」を積み上げて、各シートの範囲を作る
  let cur=start,sheets=[],cursor=start;
  for(let i=0;i<conf.n;i++){
    const a=I(cursor),b=I(A(cursor,conf.days-1));
    // そのシート終了後に実際に休薬が入っていれば、その分だけ次のシートをずらす
    let gap=0,d=A(cursor,conf.days);
    for(let g=0;g<+s.rest;g++){ if(E(I(A(d,g))).rest)gap=g+1; else break; }
    sheets.push({no:i+1,a,b,gap:gap});
    cursor=A(d,gap);
  }
  // 飲み終えたシート数＝最終服薬日を含むシートまで
  // いま何錠目か：記録があれば数える。記録が無い期間ならシート開始日からの経過日数で代用。
  const today0=I(T());
  const cnt=(a,b)=>{let n=0;for(let d=P(a);d<=P(b);d=A(d,1))if(E(I(d)).med)n++;return n};
  let taken=cnt(sheets[0].a,today0);
  if(!taken)taken=Math.round((T()-P(sheets[0].a))/86400000)+1;
  taken=Math.max(1,Math.min(conf.days,taken));
  const idx=Math.min(Math.floor((taken-1)/conf.days),sheets.length-1);
  const remain=Math.max(0,conf.days-taken);
  const rawSh=sheets[idx];
  const sh=rawSh||{no:1,a:conf.start,b:conf.start,gap:0};
  const last=sh.gap?I(A(P(sh.b),sh.gap)):sh.b;      // 休薬込みの見込み最終服薬日（=予定の最終日）
  const periodStart=I(A(P(sh.b),-(Math.min(10,conf.days)-1)));  // 最後の10日間
  const periodEnd=sh.b;
  const today=I(T());
  const inPeriod=today>=periodStart&&today<=periodEnd;
  const afterPeriod=today>periodEnd;
  const lastWeekday=weekdayOnOrBefore(periodEnd);
  const exam=s.exam||'';
  let daysToExam=null;
  if(exam)daysToExam=Math.round((P(exam)-T())/86400000);
  return {conf,sheets,idx,taken,remain,sh,last,periodStart,periodEnd,inPeriod,afterPeriod,lastWeekday,exam,daysToExam,
    no:(+s.sheetBase||1)-1+sh.no,afterRest:sh.gap?{a:I(A(P(sh.b),1)),b:I(A(P(sh.b),sh.gap))}:null};
}
function weekdayOnOrBefore(x){let d=P(x);while([0,6].includes(d.getDay()))d=A(d,-1);return I(d)}
const W=['日','月','火','水','木','金','土'];
function wd(x){return W[P(x).getDay()]}

function status(){
  const x=I(T()),e=E(x);
  if(e.rest){return ['rest',restRun(x)]}
  if(e.med){return ['med',medRun(x)]}
  return ['none',0]
}
function toast(t){let q=document.createElement('div');q.className='toast';q.textContent=t;document.body.append(q);setTimeout(()=>q.remove(),1600)}
function take(){
  const x=I(T()),old=E(x);
  // 服薬を押した瞬間に「服薬1日目」へ反映。出血記録は消さない。
  set(x,{...old,med:true,rest:false,time:new Date().toISOString()});
  render();toast('今日の服薬を記録しました');
}
function manualRest(){
  const st=T(),ds=[];
  for(let i=0;i<+s.rest;i++){
    const x=I(A(st,i)),old=E(x);
    s.e[x]={...old,med:false,rest:true};
    ds.push(x);
  }
  save();render();toast('今日から休薬を開始しました');
}
function bleed(){
  const x=I(T()),old=E(x),next=!old.bleed;
  set(x,{...old,bleed:next});
  autoRest();render();toast(next?'出血を記録しました':'出血記録を解除しました');
}
function home(){
  let [t,n]=status(),x=I(T()),e=E(x),pct=t==='med'?Math.min(100,n/+s.max*100):t==='rest'?n/+s.rest*100:0;
  const b=[0,1,2].filter(i=>E(I(A(T(),-i))).bleed).length;
  const ps=plannedRestStart();
  let next='—';
  if(t==='rest')next=`休薬中（あと${Math.max(0,+s.rest-n)}日）`;
  else if(ps)next=`${F(ps)}から${s.rest}日`;
  else if(t==='med')next=`あと${Math.max(0,+s.max-n)}日`;
  document.querySelector('#home').innerHTML=`
  <div class="card status"><div class="small">${t==='rest'?'現在は休薬期間':t==='med'?'現在は服薬期間':'記録待ち'}</div><div class="big">${t==='rest'?`休薬 ${n}日目`:t==='med'?`連続服薬 ${n}日目`:'服薬開始前'}</div><div class="small">${F(x)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="note">${t==='rest'?`あと${Math.max(0,+s.rest-n)}日で服薬再開`:`上限 ${s.max}日まであと${Math.max(0,+s.max-n)}日`}</div></div>
  <div class="card"><div class="row"><button class="btn b" onclick="take()">💊 服薬${e.med?' ✓':''}</button><button class="btn g" onclick="manualRest()">🌱 休薬</button><button class="btn r" onclick="bleed()">🌷${e.bleed?' ✓':''}</button></div><div class="note" style="margin-top:9px">${e.time?'服薬時刻：'+new Date(e.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'「服薬」を押すと、今日の服薬としてすぐに記録されます。'}</div></div>

  ${(()=>{const S=sheetInfo();
    let st,colour,main,sub;
    if(S.exam){
      const d=S.daysToExam;
      main=`診察予定 ${F(S.exam)}（${wd(S.exam)}）`;
      sub=d>0?`あと${d}日`:(d===0?'今日です':`${-d}日過ぎています`);
      colour=d<0?'#ffe1e6':(d<=2?'#fff3d6':'#eef7ee');
    }else{
      main='予定（未定）';sub='カレンダーの日付をタップして「診察」を選ぶと登録できます';
      colour='#fff8fa';
    }
    const pr=S.afterPeriod?'診察期間が終了しました':(S.inPeriod?'診察期間中':'まだ診察期間の前です');
    return `<div class="card" style="background:${colour}">
      <h3>🏥 診察のめやす</h3>
      <p style="margin:8px 0 4px;font-size:15px"><b>シート ${S.no}／${S.conf.n}</b> ・ ${S.conf.days}錠中 ${S.taken}錠目（残り ${S.remain}錠）</p>
      <p style="margin:4px 0;font-size:13px">診察期間 ${F(S.periodStart)} 〜 ${F(S.periodEnd)}</p>
      <p style="margin:4px 0;font-size:13px">［${main}・${sub}］</p>
      <div class="note" style="margin-top:8px">${pr}／最終服薬日は ${F(S.last)}（${wd(S.last)}）の見込み。${S.lastWeekday!==S.periodEnd?`薬が切れる前に 平日の ${F(S.lastWeekday)} が実質の期限です。`:''}</div>
    </div>`})()}
  <div class="card"><div class="summary"><div class="mini"><span>次の休薬予定</span><b>${next}</b></div><div class="mini"><span>過去3日間の出血</span><b>${b}日</b></div></div>${ps?`<p class="note" style="margin-top:10px">📅 カレンダーでは、次の休薬${F(ps)}〜${F(I(A(P(ps),+s.rest-1)))}を予定として表示しています。</p>`:''}</div>
`
}
function cal(){
  let y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),w=f.getDay(),planned=projectedRestDates(),h='';
  for(let q of ['日','月','火','水','木','金','土'])h+=`<div class="dow">${q}</div>`;
  for(let i=0;i<w;i++)h+='<div></div>';
  const S=sheetInfo();
  for(let d=1;d<=days;d++){
    let x=I(new Date(y,m,d)),e=E(x),isPlan=planned.has(x)&&!e.rest;
    const inPeriod=x>=S.periodStart&&x<=S.periodEnd,isExam=(s.exam===x);
    let marks=(e.med?'💊':'')+(e.rest?'🌱':'')+(e.bleed?'🌷':'')+(isPlan?'🌱':'')+(isExam?'🏥':'');
    h+=`<button class="day ${x===I(T())?'today':''} ${isPlan?'planned':''} ${inPeriod?'exam-period':''} ${isExam?'exam-day':''}" onclick="edit('${x}')"><b>${d}</b><div class="mark">${marks||' '}</div>${isPlan?'<div style="font-size:9px;color:#8b7545">休薬予定</div>':''}${inPeriod&&d===P(S.periodStart).getDate()?'<div style="font-size:8px;color:#4a6b96;font-weight:700">診察期間</div>':''}</button>`
  }
  document.querySelector('#calendar').innerHTML=`<div class="card"><div class="month"><button class="nav" onclick="shiftMonth(-1)">‹</button><b>${y}年${m+1}月</b><button class="nav" onclick="shiftMonth(1)">›</button></div><button class="today-btn" onclick="goToday()">${(y===T().getFullYear()&&m===T().getMonth())?'今日を表示中':'⌂ 今日に戻る'}</button><div class="cal">${h}</div><div class="legend"><span>💊服薬</span><span>🌱休薬</span><span>🌷出血</span><span>🏥診察予定</span><span style="background:#eef4ff;padding:1px 5px;border-radius:5px">◻診察期間</span></div><p class="note">3日連続出血、または${s.max}日連続服薬が成立すると、翌日から${s.rest}日間が自動的に休薬表示になります。休薬は🌱、出血は🌷で表示します。日付をタップすると修正できます。左右にスワイプすると前後の月に移動できます。</p></div>`
}
function edit(x){let e=E(x);const isEx=s.exam===x;
document.querySelector('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><h2>${F(x)}</h2>
<button class="btn p" onclick="setExam('${x}')">🏥 診察${isEx?' ✓（この日が予定）':''}</button><br><br>
<button class="btn b" onclick="tog('${x}','med')">服薬 ${e.med?'✓':''}</button><br><br>
<button class="btn r" onclick="tog('${x}','bleed')">出血 ${e.bleed?'✓':''}</button><br><br>
<button class="btn g" onclick="tog('${x}','rest')">休薬 ${e.rest?'✓':''}</button><br><br>
${isEx?'<button class="btn gray" onclick="clearExam()">診察予定を解除</button><p class="note">いまこの日が診察予定です。</p>':'<p class="note">「🏥 診察」を押すと、この日を診察予定として登録します。過去の日付も追加・修正・削除できます。</p>'}</div></div>`}
function setExam(x){s.exam=x;save();closeM();render();toast(F(x)+'を診察予定にしました')}
function clearExam(){s.exam='';save();closeM();render();toast('診察予定を解除しました')}
function closeM(){document.querySelector('#modal').innerHTML=''}
function tog(x,k){let e=E(x);e[k]=!e[k];if(k==='med'&&e.med){e.rest=false;e.time=new Date().toISOString()}if(k==='rest'&&e.rest)e.med=false;set(x,e);autoRest();closeM();render()}
function del(x){delete s.e[x];save();closeM();render()}
function history(){let meds=Object.keys(s.e).filter(x=>E(x).med).sort(),groups=[],cur=null;for(const x of meds){if(!cur||I(A(P(cur.b),1))!==x){if(cur)groups.push(cur);cur={a:x,b:x}}else cur.b=x}if(cur)groups.push(cur);document.querySelector('#history').innerHTML=`<div class="card"><h3>サイクル履歴</h3><div class="list">${groups.length?groups.map((c,i)=>{let rs=Object.keys(s.e).filter(x=>E(x).rest&&x>=I(A(P(c.b),1))).sort();let r1=rs[0],r2=r1?rs[Math.min(+s.rest-1,rs.length-1)]:null;return `<div class="cycle"><b>第${i+1}サイクル</b><p>服薬：${F(c.a)}〜${F(c.b)}（${Math.floor((P(c.b)-P(c.a))/86400000)+1}日）</p><p>休薬：${r1?F(r1)+'〜'+F(r2):'—'}</p></div>`}).join(''):'<p class="note">服薬記録がまだありません。</p>'}</div></div>`}
function settings(){document.querySelector('#settings').innerHTML=`<div class="card"><h3>設定</h3><h4 style="margin:20px 0 4px">判定ルール</h4><label>連続服薬の上限日数</label><input id="mx" type="number" min="1" max="365" value="${s.max}"><label>休薬日数</label><input id="rs" type="number" min="1" max="14" value="${s.rest}"><div class="rulebox"><p><b>① 連続服薬の上限</b><br>${s.max}日連続で服薬した場合、翌日から${s.rest}日間を休薬とします。</p><p><b>② 3日連続の出血</b><br>出血が3日連続した場合は、${s.max}日の上限よりもこちらを優先し、3日目の翌日から${s.rest}日間を休薬とします。</p><p><b>③ 手動休薬</b><br>ホームの「休薬」を押すと、今日から${s.rest}日間を休薬として記録します。</p></div><button class="btn p" style="margin-top:16px;width:100%" onclick="saveSet()">設定を保存</button><p class="note">初期値：連続服薬120日／休薬4日。データは端末のLocalStorageに保存されます。保存状態：${store.ok?'OK':'保存不可（プライベートブラウズ等）'}／記録日数：${Object.keys(s.e).length}日。</p></div><div class="card"><h3>シート管理</h3><p class="note" style="margin-top:0">いま飲んでいるシートの情報です。ここを直すと、ホームの「診察のめやす」とカレンダーの診察期間が計算し直されます。</p>
<label>このシートの飲み始めた日</label><input id="shs" type="date" value="${s.sheetStart||''}">
<div class="row"><div style="flex:1"><label>1シートの錠数</label><input id="sd" type="number" min="1" max="90" value="${s.sheetDays||24}"></div><div style="flex:1"><label>処方シート数</label><input id="shn" type="number" min="1" max="12" value="${s.sheets||3}"></div></div>
<label>このシートは何シート目か</label><input id="shb" type="number" min="1" max="12" value="${s.sheetBase||3}">
<label>診察予定日（空欄なら未定）</label><input id="exm" type="date" value="${s.exam||''}">
<button class="btn p" style="margin-top:16px;width:100%" onclick="saveSheet()">シート情報を保存</button></div>
<div class="card"><h3>記録のバックアップ</h3><p class="note" style="margin-top:0">記録を1つのファイルに書き出します。機種変更や引っ越しのときに、新しい端末で「ファイルから復元」を選んでください。</p><div class="row"><button class="btn g" onclick="expJSON()">ファイルに書き出す</button><button class="btn b" onclick="document.querySelector('#imp').click()">ファイルから復元</button></div><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="impJSON(this)"><p class="note">iPhoneでは書き出したファイルは「ファイル」アプリに保存されます。復元は今の記録を置き換えるので、実行前に確認画面が出ます。</p></div><div class="card"><button class="btn gray" style="width:100%" onclick="if(confirm('全記録を削除しますか？')){s={max:120,rest:4,api:s.api,tok:s.tok,e:{}};save();render()}else{}">全記録を削除</button></div>`}
function saveSet(){
  s.max=+document.querySelector('#mx').value||120;
  s.rest=+document.querySelector('#rs').value||4;
  save();render();toast('設定を保存しました');
}
/* ---------- 月の移動と「今日に戻る」 ---------- */
function shiftMonth(n){cm.setMonth(cm.getMonth()+n);render()}
function goToday(){cm=T();cm.setDate(1);render();toast('今月を表示しました')}
/* カレンダーを左右にスワイプして月を移動（縦スクロールは邪魔しない） */
(function(){
  const el=document.querySelector('#calendar');
  if(!el)return;
  let sx=0,sy=0,st=0,on=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){on=false;return}
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();on=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!on)return;on=false;
    const t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;
    if(dt>1200||Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;  // 長押し・縦スクロールは無視
    shiftMonth(dx<0?1:-1);
  },{passive:true});
})();
/* ---------- 記録のバックアップ（書き出し／読み込み） ---------- */
function expJSON(){
  const data={app:'pillManager',version:4,exportedAt:new Date().toISOString(),max:s.max,rest:s.rest,records:s.e};
  const name='服薬管理_'+I(T())+'.json';
  try{
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
    toast('ファイルに保存しました');
  }catch(err){toast('保存できませんでした：'+err.message)}
}
function impJSON(inp){
  const f=inp.files&&inp.files[0];if(!f){return}
  const r=new FileReader();
  r.onload=()=>{
    let d=null;
    try{d=JSON.parse(r.result)}catch(err){toast('読み込めません（形式が違います）');inp.value='';return}
    const rec=d&&(d.records||d.e);
    if(!rec||typeof rec!=='object'){toast('記録が見つかりません');inp.value='';return}
    const clean={};
    for(const k in rec){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&rec[k]&&typeof rec[k]==='object')clean[k]=rec[k]}
    const n=Object.keys(clean).length;
    if(!n){toast('記録が見つかりません');inp.value='';return}
    if(!confirm('このファイルの記録 '+n+'日分で置き換えます。\nこの端末の今の記録（'+Object.keys(s.e).length+'日分）は上書きされます。よろしいですか？')){inp.value='';return}
    s.e=clean;
    if(+d.max>0)s.max=+d.max;
    if(+d.rest>0)s.rest=+d.rest;
    save();render();toast(n+'日分の記録を復元しました');inp.value='';
  };
  r.onerror=()=>{toast('ファイルを開けませんでした');inp.value=''};
  r.readAsText(f);
}
function saveSheet(){
  const v=id=>{const el=document.querySelector('#'+id);return el?el.value:''};
  const sd=+v('sd')||24,shn=+v('shn')||3,shb=+v('shb')||1;
  s.sheetDays=sd;s.sheets=shn;s.sheetBase=shb;s.sheetStart=v('shs')||s.sheetStart;s.exam=v('exm')||'';
  save();render();toast('シート情報を保存しました');
}
function render(){autoRest();home();cal();history();settings()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['home','calendar','history','settings'].forEach(p=>document.querySelector('#'+p).classList.toggle('hide',p!==b.dataset.p))});
render();
