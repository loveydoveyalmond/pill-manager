}

const I=isoOf,T=()=>{let d=new Date();d.setHours(0,0,0,0);return d},P=x=>new Date(x+'T00:00:00'),A=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},F=(()=>{const f=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});return x=>{const d=(x instanceof Date)?x:P(x);if(!d||isNaN(d.getTime()))return '—';try{return f.format(d)}catch(e){return '—'}}})(),E=x=>s.e[x]||{},save=()=>store.set(K,JSON.stringify(s));
function set(x,v){let next={...E(x),...v};if(!Object.values(next).some(Boolean))delete s.e[x];else s.e[x]=next;save()}
function medRun(x){let n=0,d=P(x);while(E(I(d)).med){n++;d=A(d,-1)}return n}
function bleedRun(x){let n=0,d=P(x);while(E(I(d)).bleed){n++;d=A(d,-1)}return n}
function restRun(x){let n=0,d=P(x);while(E(I(d)).rest){n++;d=A(d,-1)}return n}

function currentMedStart(){let last=latestMedDate();if(!last)return null;let d=P(last);while(E(I(A(d,-1))).med)d=A(d,-1);return I(d)}
function plannedRestStart(){
  const today=I(T());
  if(bleedRun(today)>=3)return I(A(T(),1));
  try{const st=sheetState();if(st.resting)return null;if(st.nextRest)return st.nextRest}catch(e){}
  return null;
}
function projectedRestDates(){
  const start=plannedRestStart();if(!start)return new Set();
  const out=new Set();for(let i=0;i<+s.rest;i++)out.add(I(A(P(start),i)));return out;
}
function autoRest(){
  // 3日連続の出血、または上限日数の連続服薬が成立したら、翌日から休薬を自動記録。
  const dates=Object.keys(s.e).sort();
  let changed=false;
  const applyRest=st=>{
    for(let i=0;i<+s.rest;i++){
      const y=I(A(P(st),i)),old=E(y);
      if(old.med||!old.rest){s.e[y]={...old,med:false,rest:true};changed=true}
    }
  };
  // ① 3日連続の出血：最初の3日目の翌日から
  let bStart=null,bPrev=null,bLen=0;
  for(const x of dates){
    if(!E(x).bleed){bStart=null;bLen=0;continue}
    if(bStart===null||I(A(P(bPrev),1))!==x){bStart=x;bLen=1}else bLen++;
    bPrev=x;
    if(bLen===3){applyRest(I(A(P(x),1)));break}
  }
  // ② 連続服薬の上限：上限に達した日の翌日から（全期間を1パスで走査）
  let mStart=null,mPrev=null,mLen=0;
  for(const x of dates){
    if(!E(x).med){mStart=null;mLen=0;continue}
    if(mStart===null||I(A(P(mPrev),1))!==x){mStart=x;mLen=1}else mLen++;
    mPrev=x;
    if(mLen>=+s.max){applyRest(I(A(P(mStart),+s.max)));break}
  }
  if(changed)save();
}

/* ===== シート（24日／3シート）と診察のめやす ===== */
/* ===== シート進行：24錠で1シート、3シートで1サイクル、飲み終えたら4日休薬 ===== */
/* ===== 2つの数を分けて扱う =====
   ① サイクルの服薬日数 … サイクル開始日から数えた通算（休薬4日で次のサイクルへ）
   ② シートの錠数     … 1シート24錠の中での位置（表示用。シートが替わると1に戻る） */
function cyclePlan(){
  const max=+s.max||120, rest=+s.rest||4;
  let cs=P(okDate(s.cycleStart)?s.cycleStart:'2026-09-26');
  const no0=+s.cycleNo||14;
  // 記録済みの休薬開始日（連続する休薬のかたまりの初日）
  const rec=Object.keys(s.e).filter(k=>E(k).rest&&!E(I(A(P(k),-1))).rest).sort();
  const starts=[]; const used={};
  for(let k=0;k<40;k++){
    let pred=A(cs,max);
    let pick=pred;
    for(const r of rec){ if(!used[r]&&P(r)>=cs&&P(r)<=pred){ pick=P(r); used[r]=1; break; } }
    starts.push({no:no0+k,from:I(cs),rest:I(pick)});
    cs=A(pick,rest);
  }
  return {max:max,rest:rest,starts:starts,no0:no0};
}
function restSet(){
  const set=new Set();
  for(const k of Object.keys(s.e)) if(E(k).rest) set.add(k);
  const cp=cyclePlan();
  for(const c of cp.starts){ for(let i=0;i<cp.rest;i++) set.add(I(A(P(c.rest),i))); }
  return set;
}
function sheetTimeline(asOf){
  const conf={days:+s.sheetDays||24,rx:+s.sheets||3,base:+s.sheetBase||1,max:+s.max||120,rest:+s.rest||4,
    start:(okDate(s.sheetStart)?s.sheetStart:'2026-11-01')};
  const R=restSet(), horizon=P(I(A(P(asOf||I(T())),420)));
  let cur=P(conf.start), N=0, dayMap={}, sheets={}, guard=0;
  while(cur<=horizon && guard<40000){
    guard++;
    const d=I(cur);
    if(R.has(d)){ dayMap[d]={type:'rest'}; cur=A(cur,1); continue; }
    N++;
    const sidx=Math.floor((N-1)/conf.days), label=((conf.base-1+sidx)%conf.rx)+1;
    dayMap[d]={type:'pill',N:N,sidx:sidx,label:label,pill:((N-1)%conf.days)+1,group:Math.floor(sidx/conf.rx)};
    if(!sheets[sidx])sheets[sidx]={sidx:sidx,first:d,last:d,label:label,group:Math.floor(sidx/conf.rx)};
    sheets[sidx].last=d;
    cur=A(cur,1);
  }
  // 処方（3シート）ごとの診察期間＝3枚目の最後の10日
  const lastOfGroup={};
  for(const k of Object.keys(sheets).map(Number)) lastOfGroup[sheets[k].group]=Math.max(lastOfGroup[sheets[k].group]||0,k);
  const cycles={};
  for(const g of Object.keys(lastOfGroup).map(Number)){
    const last=sheets[lastOfGroup[g]].last;
    cycles[g]={from:I(A(P(last),-(Math.min(10,conf.days)-1))),to:last};
  }
  return {conf:conf,sheets:sheets,dayMap:dayMap,cycles:cycles};
}
function sheetState(asOf){
  const TL=sheetTimeline(asOf), conf=TL.conf;
  const today=asOf?I(P(asOf)):I(T());
  const e=TL.dayMap[today]||{};
  const resting=(e.type==='rest');
  let restDay=0;
  if(resting){ let c=0,d=P(today); while(TL.dayMap[I(d)]&&TL.dayMap[I(d)].type==='rest'){c++;d=A(d,-1)} restDay=c; }
  let nxt=null,d=A(P(today),1);
  for(let i=0;i<120;i++){ const m=TL.dayMap[I(d)]; if(m&&m.type==='pill'){nxt={date:I(d),m:m};break} d=A(d,1) }
  // 休薬中は「最後に飲んだ錠数」で止めて表示する（錠数は休薬日には進まない）
  let lastPill=null;
  if(resting){let d=A(P(today),-1);for(let i=0;i<40;i++){const m=TL.dayMap[I(d)];if(m&&m.type==='pill'){lastPill={d:I(d),m:m};break}d=A(d,-1)}}
  const ref=(resting&&lastPill)?lastPill.m:e;

  { const R=restSet(); for(let x=P(cyc.from);x<=todayD;x=A(x,1)) if(!R.has(I(x)))cycleDoses++; }

    last:sh.last,group:group,cycles:TL.cycles,

}
function examWindows(){

function home(){
  const S=sheetState(), e=E(I(T())), x=I(T());
  const maxD=+s.max||120, restD=+s.rest||4;
  // 服薬した日数（休薬日は数えない）。今日まだ飲んでいなければ今日は数えない。
  const n=Math.max(0, S.cycleDoses-(e.med?0:1));
  const pct=Math.min(100,n/maxD*100);
  const b=[0,1,2].filter(i=>E(I(A(T(),-i))).bleed).length;
  const ps=S.nextRest||plannedRestStart();
  let next;
  if(S.resting) next=`休薬中（あと${Math.max(0,restD-S.restDay)}日）`;
  else if(ps) next=`${F(ps)}から${restD}日`;
  else next=`—`;
  const head=S.resting?'現在は休薬期間':(e.med?'現在は服薬期間':'未服薬');
  document.querySelector('#home').innerHTML=`
  <div class="card status"><div class="small">${head}</div><div class="big">${S.resting?`休薬 ${S.restDay}日目`:`${n}日目`}</div><div class="small">${F(x)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="note">${S.resting?`あと${Math.max(0,restD-S.restDay)}日で服薬再開`:`上限 ${maxD}日まであと${Math.max(0,maxD-n)}日`}</div></div>
  <div class="card"><div class="row"><button class="btn b" onclick="take()">💊 服薬${e.med?' ✓':''}</button><button class="btn g" onclick="manualRest()">🌱 休薬</button><button class="btn r" onclick="bleed()">🌷 出血${e.bleed?' ✓':''}</button></div><div class="note" style="margin-top:9px">${e.time?'服薬時刻：'+(isNaN(new Date(e.time).getTime())?'—':new Date(e.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})):'「服薬」を押すと、今日の服薬としてすぐに記録されます。'}</div></div>

  <div class="card"><div class="summary"><div class="mini"><span>次の休薬予定</span><b>${next}</b></div><div class="mini"><span>過去3日間の出血</span><b>${b}日</b></div></div>${ps?`<p class="note" style="margin-top:10px">📅 カレンダーでは、次の休薬${F(ps)}〜${F(I(A(P(ps),+s.rest-1)))}を予定として表示しています。</p>`:''}</div>
  ${(()=>{const S=sheetState();
    const cur=S.cycles[S.group]||{from:S.last,to:S.last};
    const ex=S.exam?`<b>${F(S.exam)}（${wd(S.exam)}）</b>`:`<b>予定（未定）</b>`;
    const fut=[1,2].map(i=>S.cycles[S.group+i]).filter(Boolean)
      .map((w,i)=>`<p class="note" style="margin:3px 0 0">${i===0?'次回':'次々回'}　${F(w.from)} 〜 ${F(w.to)}</p>`).join('');
    const mini1=`<div class="mini"><span>シート</span><b>${S.sheet}／${S.conf.rx}</b></div>`;
    const mini2=S.resting
      ? `<div class="mini"><span>休薬</span><b>${S.restDay}日目</b></div>`
      : `<div class="mini"><span>残り</span><b>${S.remain}錠</b></div>`;
    const cyc=`<div class="mini"><span>第${S.cycleNo}サイクル</span><b>${S.cycleDoses}日目</b></div>`;
    const cyc2=S.nextRest?`<div class="mini"><span>次の休薬</span><b>${F(S.nextRest)}から${S.conf.rest}日</b></div>`:`<div class="mini"><span>次の休薬</span><b>—</b></div>`;
    const note=S.resting
      ? `休薬中です。次は ${S.nextDate?F(S.nextDate):'—'} から <b>${S.nextSheet||1}シート目・${S.nextPillNo||1}錠目</b> です。`
      : `最終服薬日は ${F(cur.to)}（${wd(cur.to)}）の見込みです。`;
    return `<div class="card">
      <h3>🏥 診察のめやす</h3>
      <div class="summary">${mini1}${mini2}</div>
      <div class="summary" style="margin-top:9px">${cyc}${cyc2}</div>
      <p class="note" style="margin-top:10px">診察期間　${F(cur.from)} 〜 ${F(cur.to)}<br>${note}</p>
      <p style="margin:9px 0 0;font-size:13px">診察予定　${ex}</p>
      <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line)">${fut}<p class="note" style="margin-top:4px">この先の処方（3シートずつ）の診察期間です。</p></div>
    </div>`})()}
`
}
function cal(){
  let y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),w=f.getDay(),planned=projectedRestDates(),h='';
  for(let q of ['日','月','火','水','木','金','土'])h+=`<div class="dow">${q}</div>`;
  for(let i=0;i<w;i++)h+='<div></div>';
  const WS=examWindows();
  for(let d=1;d<=days;d++){
    let x=I(new Date(y,m,d)),e=E(x),isPlan=planned.has(x)&&!e.rest;
    const W=WS.find(w=>x>=w.from&&x<=w.to);const inPeriod=!!W,isExam=(s.exam===x);
    let marks=(e.med?'💊':'')+(e.rest?'🌱':'')+(e.bleed?'🌷':'')+(isPlan?'🌱':'')+(isExam?'🏥':'');
    h+=`<button class="day ${x===I(T())?'today':''} ${isPlan?'planned':''} ${inPeriod?'exam-period':''} ${isExam?'exam-day':''}" onclick="edit('${x}')"><b>${d}</b><div class="mark">${marks||' '}</div>${isPlan?'<div style="font-size:9px;color:#8b7545">休薬予定</div>':''}${inPeriod&&x===W.from?'<div style="font-size:8px;color:#4a6b96;font-weight:700">診察期間</div>':''}</button>`
  }
  document.querySelector('#calendar').innerHTML=`<div class="card"><div class="month"><button class="nav" onclick="shiftMonth(-1)">‹</button><b>${y}年${m+1}月</b><button class="nav" onclick="shiftMonth(1)">›</button></div><button class="today-btn" onclick="goToday()">${(y===T().getFullYear()&&m===T().getMonth())?'今日を表示中':'⌂ 今日に戻る'}</button><div class="cal">${h}</div><div class="legend"><span>💊服薬</span><span>🌱休薬</span><span>🌷出血</span><span>🏥診察予定</span><span style="background:#eef4ff;padding:1px 5px;border-radius:5px">◻診察期間</span></div><p class="note">3日連続出血、または${s.max}日連続服薬が成立すると、翌日から${s.rest}日間が自動的に休薬表示になります。休薬は🌱、出血は🌷で表示します。日付をタップすると修正できます。左右にスワイプすると前後の月に移動できます。</p></div>`
}
function edit(x){let e=E(x);const isEx=s.exam===x;
document.querySelector('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><h2>${F(x)}</h2>
<button class="btn b" onclick="tog('${x}','med')">💊 服薬 ${e.med?'✓':''}</button><br><br>
<button class="btn g" onclick="tog('${x}','rest')">🌱 休薬 ${e.rest?'✓':''}</button><br><br>
<button class="btn r" onclick="tog('${x}','bleed')">🌷 出血 ${e.bleed?'✓':''}</button><br><br>
<button class="btn p" onclick="setExam('${x}')">🏥 診察${isEx?' ✓（この日が予定）':''}</button><br><br>
${isEx?'<button class="btn gray" onclick="clearExam()">診察予定を解除</button><p class="note">いまこの日が診察予定です。</p>':'<p class="note">「🏥 診察」を押すと、この日を診察予定として登録します。過去の日付も追加・修正・削除できます。</p>'}<button class="btn gray" onclick="del('${x}')" style="margin-top:14px">この日の記録を削除</button></div></div>`}
function setExam(x){s.exam=x;save();closeM();render();toast(F(x)+'を診察予定にしました')}
function clearExam(){s.exam='';save();closeM();render();toast('診察予定を解除しました')}
function closeM(){document.querySelector('#modal').innerHTML=''}
function tog(x,k){let e=E(x);e[k]=!e[k];if(k==='med'&&e.med){e.rest=false;e.time=new Date().toISOString()}if(k==='rest'&&e.rest)e.med=false;set(x,e);autoRest();closeM();render()}
function del(x){delete s.e[x];save();closeM();render()}
function history(){let meds=Object.keys(s.e).filter(x=>E(x).med).sort(),groups=[],cur=null;for(const x of meds){if(!cur||I(A(P(cur.b),1))!==x){if(cur)groups.push(cur);cur={a:x,b:x}}else cur.b=x}if(cur)groups.push(cur);document.querySelector('#history').innerHTML=`<div class="card"><h3>サイクル履歴</h3><div class="list">${groups.length?groups.map((c,i)=>{let rs=Object.keys(s.e).filter(x=>E(x).rest&&x>=I(A(P(c.b),1))).sort();let r1=rs[0],r2=r1?rs[Math.min(+s.rest-1,rs.length-1)]:null;return `<div class="cycle"><b>第${i+1}サイクル</b><p>服薬：${F(c.a)}〜${F(c.b)}（${Math.floor((P(c.b)-P(c.a))/86400000)+1}日）</p><p>休薬：${r1?F(r1)+'〜'+F(r2):'—'}</p></div>`}).join(''):'<p class="note">服薬記録がまだありません。</p>'}</div></div>`}
function settings(){document.querySelector('#settings').innerHTML=`<div class="card"><h3>設定</h3><h4 style="margin:20px 0 4px">判定ルール</h4><label>連続服薬の上限日数</label><input id="mx" type="number" min="1" max="365" value="${s.max}"><label>休薬日数</label><input id="rs" type="number" min="1" max="14" value="${s.rest}"><div class="rulebox"><p><b>① 連続服薬の上限</b><br>${s.max}日連続で服薬した場合、翌日から${s.rest}日間を休薬とします。</p><p><b>② 3日連続の出血</b><br>出血が3日連続した場合は、${s.max}日の上限よりもこちらを優先し、3日目の翌日から${s.rest}日間を休薬とします。</p><p><b>③ 手動休薬</b><br>ホームの「休薬」を押すと、今日から${s.rest}日間を休薬として記録します。</p></div><button class="btn p" style="margin-top:16px;width:100%" onclick="saveSet()">設定を保存</button><p class="note">初期値：連続服薬120日／休薬4日。データは端末のLocalStorageに保存されます。保存状態：${store.ok?'OK':'保存不可（プライベートブラウズ等）'}／記録日数：${Object.keys(s.e).length}日。</p></div><div class="card"><h3>シート管理</h3><p class="note" style="margin-top:0">いま飲んでいるシートの情報です。ここを直すと、ホームの「診察のめやす」とカレンダーの診察期間が計算し直されます。<br>シートを飲み終えても自動では休薬しません（続けて次のシートに進みます）。休薬が入るのは<b>3日連続の出血・連続服薬120日・手動（ホームの「休薬」またはカレンダーの日付）</b>のときだけです。</p>
<label>1シート目の飲み始めた日</label><input id="shs" type="date" value="${s.sheetStart||''}">
<div class="row"><div style="flex:1"><label>1シートの錠数</label><input id="sd" type="number" min="1" max="90" value="${s.sheetDays||24}"></div><div style="flex:1"><label>処方シート数</label><input id="shn" type="number" min="1" max="12" value="${s.sheets||3}"></div></div>
<label>いま何シート目か</label><input id="shb" type="number" min="1" max="12" value="${s.sheetBase||1}">
<div class="row"><div style="flex:1"><label>第何サイクルか</label><input id="cyn" type="number" min="1" max="999" value="${s.cycleNo||14}"></div><div style="flex:1"><label>そのサイクル開始日</label><input id="cys" type="date" value="${s.cycleStart||''}"></div></div>
<p class="note" style="margin-top:6px">サイクル＝休薬をはさむ前までの連続服薬。開始日から<b>${s.max||120}日</b>目まで飲んだら、翌日から${s.rest||4}日休薬します。</p>
<label>診察予定日（空欄なら未定）</label><input id="exm" type="date" value="${s.exam||''}">
<button class="btn p" style="margin-top:16px;width:100%" onclick="saveSheet()">シート情報を保存</button></div>
<div class="card"><h3>記録のバックアップ</h3><p class="note" style="margin-top:0">記録を1つのファイルに書き出します。機種変更や引っ越しのときに、新しい端末で「ファイルから復元」を選んでください。</p><div class="row"><button class="btn g" onclick="expJSON()">ファイルに書き出す</button><button class="btn b" onclick="document.querySelector('#imp').click()">ファイルから復元</button></div><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="impJSON(this)"><p class="note">iPhoneでは書き出したファイルは「ファイル」アプリに保存されます。復元は今の記録を置き換えるので、実行前に確認画面が出ます。</p></div><div class="card"><button class="btn gray" style="width:100%" onclick="if(confirm('全記録を削除しますか？')){s={max:120,rest:4,api:s.api,tok:s.tok,e:{}};save();render()}else{}">全記録を削除</button></div>`}
function saveSet(){
  s.max=+document.querySelector('#mx').value||120;
  s.rest=+document.querySelector('#rs').value||4;
  save();render();toast('設定を保存しました');
}
/* ---------- 月の移動と「今日に戻る」 ---------- */
function shiftMonth(n){cm.setMonth(cm.getMonth()+n);render()}
function goToday(){cm=T();cm.setDate(1);render();toast('今月を表示しました')}
/* カレンダーを左右にスワイプして月を移動（縦スクロールは邪魔しない） */
(function(){
  const el=document.querySelector('#calendar');
  if(!el)return;
  let sx=0,sy=0,st=0,on=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){on=false;return}
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();on=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!on)return;on=false;
    const t=e.changedTouches&&e.changedTouches[0];if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;
    if(dt>1200||Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;  // 長押し・縦スクロールは無視
    shiftMonth(dx<0?1:-1);
  },{passive:true});
})();
/* ---------- 記録のバックアップ（書き出し／読み込み） ---------- */
function expJSON(){
  const data={app:'pillManager',version:4,exportedAt:new Date().toISOString(),max:s.max,rest:s.rest,records:s.e};
  const name='服薬管理_'+I(T())+'.json';
  try{
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
    toast('ファイルに保存しました');
  }catch(err){toast('保存できませんでした：'+err.message)}
}
function impJSON(inp){
  const f=inp.files&&inp.files[0];if(!f){return}
  const r=new FileReader();
  r.onload=()=>{
    let d=null;
    try{d=JSON.parse(r.result)}catch(err){toast('読み込めません（形式が違います）');inp.value='';return}
    const rec=d&&(d.records||d.e);
    if(!rec||typeof rec!=='object'){toast('記録が見つかりません');inp.value='';return}
    const clean={};
    for(const k in rec){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&rec[k]&&typeof rec[k]==='object')clean[k]=rec[k]}
    const n=Object.keys(clean).length;
    if(!n){toast('記録が見つかりません');inp.value='';return}
    if(!confirm('このファイルの記録 '+n+'日分で置き換えます。\nこの端末の今の記録（'+Object.keys(s.e).length+'日分）は上書きされます。よろしいですか？')){inp.value='';return}
    s.e=clean;
    if(+d.max>0)s.max=+d.max;
    if(+d.rest>0)s.rest=+d.rest;
    save();render();toast(n+'日分の記録を復元しました');inp.value='';
  };
  r.onerror=()=>{toast('ファイルを開けませんでした');inp.value=''};
  r.readAsText(f);
}
function saveSheet(){
  const v=id=>{const el=document.querySelector('#'+id);return el?el.value:''};
  const sd=+v('sd')||24,shn=+v('shn')||3,shb=+v('shb')||1;
  s.rev=3;s.sheetDays=sd;s.sheets=shn;s.sheetBase=shb;s.cycleNo=+v('cyn')||s.cycleNo;s.cycleStart=okDate(v('cys'))?v('cys'):s.cycleStart;s.sheetStart=okDate(v('shs'))?v('shs'):s.sheetStart;s.exam=okDate(v('exm'))?v('exm'):'';
  save();render();toast('シート情報を保存しました');
}
function render(){autoRest();home();cal();history();settings()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['home','calendar','history','settings'].forEach(p=>document.querySelector('#'+p).classList.toggle('hide',p!==b.dataset.p))});
render();
